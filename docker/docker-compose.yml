version: '3.8'

services:
  opennow-postgres:
    image: postgres:16-alpine
    container_name: opennow-postgres
    restart: always
    environment:
      POSTGRES_USER: opennow_user
      POSTGRES_PASSWORD: opennow_secure_password
      POSTGRES_DB: opennow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennow_user -d opennow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  opennow-redis:
    image: redis:7-alpine
    container_name: opennow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
